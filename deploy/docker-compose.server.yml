services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: kronos-backend:${KRONOS_IMAGE_TAG:?KRONOS_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_NAME: ${APP_NAME:-kronos}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      RESOURCE_SECRET_KEY: ${RESOURCE_SECRET_KEY:?RESOURCE_SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      LLM_ASSISTANT_ENABLED: ${LLM_ASSISTANT_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-6}
      VM_DHCP_LEASES_URL: ${VM_DHCP_LEASES_URL:-http://172.168.131.94:9400/dhcpd.leases}
      VM_IMAGE_REPO_ROOT: ${VM_IMAGE_REPO_ROOT:-http://172.168.131.94:9400/repo_list/mugen.mirror}
      MUGEN_REPO_URL: ${MUGEN_REPO_URL:-https://atomgit.com/openeuler/mugen.git}
      MUGEN_REPO_BRANCH: ${MUGEN_REPO_BRANCH:-master}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Shanghai}
      VM_NETWORK_BRIDGE: ${VM_NETWORK_BRIDGE:-br0}
      VM_HOST_SSH_KEY_PATH: ${VM_HOST_SSH_KEY_PATH:-/etc/kronos/ssh/id_rsa}
      VM_HOST_SCRIPT_TIMEOUT_SECONDS: ${VM_HOST_SCRIPT_TIMEOUT_SECONDS:-4200}
      VM_MAX_CONCURRENT_PER_HOST: ${VM_MAX_CONCURRENT_PER_HOST:-4}
      VM_OPENEULER_UPDATE_REPO_ROOT: ${VM_OPENEULER_UPDATE_REPO_ROOT:-http://121.36.84.172/repo.openeuler.org}
      VM_DAILYBUILD_REPO_ROOT: ${VM_DAILYBUILD_REPO_ROOT:-http://121.36.84.172/dailybuild}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /etc/kronos/ssh:/etc/kronos/ssh:ro
      - ${VM_ISO_UPLOAD_HOST_DIR:?VM_ISO_UPLOAD_HOST_DIR is required}:/var/lib/kronos/uploads:z
      - /data/test-logs:/data/test-logs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/database', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: kronos-backend:${KRONOS_IMAGE_TAG:?KRONOS_IMAGE_TAG is required}
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:?CELERY_WORKER_CONCURRENCY is required}",
        "--prefetch-multiplier=1",
      ]
    stop_grace_period: 20m
    environment:
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_NAME: ${APP_NAME:-kronos}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      RESOURCE_SECRET_KEY: ${RESOURCE_SECRET_KEY:?RESOURCE_SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:?CELERY_WORKER_CONCURRENCY is required}
      VM_DHCP_LEASES_URL: ${VM_DHCP_LEASES_URL:-http://172.168.131.94:9400/dhcpd.leases}
      VM_IMAGE_REPO_ROOT: ${VM_IMAGE_REPO_ROOT:-http://172.168.131.94:9400/repo_list/mugen.mirror}
      MUGEN_REPO_URL: ${MUGEN_REPO_URL:-https://atomgit.com/openeuler/mugen.git}
      MUGEN_REPO_BRANCH: ${MUGEN_REPO_BRANCH:-master}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Shanghai}
      VM_NETWORK_BRIDGE: ${VM_NETWORK_BRIDGE:-br0}
      VM_HOST_SSH_KEY_PATH: ${VM_HOST_SSH_KEY_PATH:-/etc/kronos/ssh/id_rsa}
      VM_HOST_SCRIPT_TIMEOUT_SECONDS: ${VM_HOST_SCRIPT_TIMEOUT_SECONDS:-4200}
      VM_MAX_CONCURRENT_PER_HOST: ${VM_MAX_CONCURRENT_PER_HOST:-4}
      VM_OPENEULER_UPDATE_REPO_ROOT: ${VM_OPENEULER_UPDATE_REPO_ROOT:-http://121.36.84.172/repo.openeuler.org}
      VM_DAILYBUILD_REPO_ROOT: ${VM_DAILYBUILD_REPO_ROOT:-http://121.36.84.172/dailybuild}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /etc/kronos/ssh:/etc/kronos/ssh:ro
      - /data/test-logs:/data/test-logs
    restart: unless-stopped
    logging: *default-logging

  beat:
    image: kronos-backend:${KRONOS_IMAGE_TAG:?KRONOS_IMAGE_TAG is required}
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/var/lib/celery/celerybeat-schedule",
      ]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_NAME: ${APP_NAME:-kronos}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - celery_beat_data:/var/lib/celery
    restart: unless-stopped
    logging: *default-logging

  bot:
    image: kronos-backend:${KRONOS_IMAGE_TAG:?KRONOS_IMAGE_TAG is required}
    command: ["python", "-m", "app.bot"]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_NAME: ${APP_NAME:-kronos}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RESOURCE_SECRET_KEY: ${RESOURCE_SECRET_KEY:?RESOURCE_SECRET_KEY is required}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Shanghai}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      LLM_ASSISTANT_ENABLED: ${LLM_ASSISTANT_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-6}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: kronos-frontend:${KRONOS_IMAGE_TAG:?KRONOS_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:?WEB_PORT is required}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${VM_ISO_UPLOAD_HOST_DIR:?VM_ISO_UPLOAD_HOST_DIR is required}:/var/lib/kronos/uploads:ro,z
    restart: unless-stopped
    logging: *default-logging

volumes:
  celery_beat_data:
  postgres_data:
