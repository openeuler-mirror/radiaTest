[project]
name = "kronos-backend"
version = "0.1.0"
description = "radiaTest FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "celery[redis]>=5.5.0",
  "fastapi>=0.115.0",
  "lark-oapi>=1.7.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.9.0",
  "pyjwt>=2.10.0",
  "pwdlib[argon2]>=0.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
  "cryptography>=45.0.0",
  "zstandard>=0.23.0",
  "xlwt>=1.3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
